[project]
name = "abeg"
version = "0.1.0"
description = "Abeg order-agent demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "asyncpg",
    "httpx",
    "websockets",
    "python-dotenv",
    "pytest",
    "pytest-asyncio",
    "anyio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
